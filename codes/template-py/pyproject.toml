[project]
name = "template-py"
version = "0.0.1"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF", "PERF", "NPY", "PD"]

[tool.ruff.format]
docstring-code-format = true

[tool.basedpyright]
pythonVersion = "3.12"
pythonPlatform = "All"
typeCheckingMode = "all"
include = ["src", "tests"]
exclude = ["**/__pycache__", ".venv"]
reportAny = false
reportExplicitAny = false
reportMissingTypeStubs = "warning"
reportUnusedCallResult = false

[tool.pytest]
addopts = ["-ra", "--strict-markers", "--strict-config"]
testpaths = ["tests"]
